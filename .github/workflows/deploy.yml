name: Deploy watch.tuvora.co

# Same shape as nuvio-web: build on a GitHub-hosted runner, deploy from the in-cluster runner
# (deploy/k8s/runner.yaml), so no kubeconfig lives in GitHub. A static nginx image builds in
# about a minute.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/paradox-kush/tuvoraweb

jobs:
  build:
    if: github.repository == 'paradox-kush/TuvoraWeb'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - id: meta
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            NUVIO_RELEASE_CHANNEL=stable
            NUVIO_BUILD_REVISION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, k3s]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Ensure the namespace exists
        run: kubectl create namespace tuvora-web --dry-run=client -o yaml | kubectl apply -f -

      - name: Refresh the GHCR pull credential
        run: |
          kubectl -n tuvora-web create secret docker-registry ghcr \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests
        run: kubectl apply -f deploy/k8s/app.yaml

      - name: Roll out the new image
        run: |
          kubectl -n tuvora-web set image deployment/tuvora-web \
            web=${{ env.IMAGE }}:${{ needs.build.outputs.tag }}
          kubectl -n tuvora-web rollout status deployment/tuvora-web --timeout=180s

      - name: Report
        run: kubectl -n tuvora-web get pods -o wide
